function speak(t){
  if(!("speechSynthesis" in window)){say("Озвучка не поддерживается","no");return}
  try{if(rec&&live)rec.abort()}catch(e){}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.8;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("en"));if(v)u.voice=v;speechSynthesis.speak(u);
}
function mic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say("Нужен Chrome или Safari","no");return}
  if(live){try{rec.stop()}catch(e){}return}
  const id=curId();if(id==null)return;const prac=c.done;if(!prac&&c.att>=3)return;
  try{speechSynthesis.cancel()}catch(e){}
  const t=norm(gr(id)),r=new SR();let fin=false,t1=null,t2=null;
  const off=()=>{clearTimeout(t1);clearTimeout(t2)};
  const finish=(ok,heard)=>{
    if(fin)return;fin=true;off();try{r.abort()}catch(e){}if(rec===r)live=false;
    if(prac){say(ok?"Верно!":"Не то («"+(heard||"…")+"»). Можно ещё раз.",ok?"ok":"no");return}
    c.att++;
    if(ok){const s=c.att<=2?"g":"y";L().res[id]=s;c.done=true;c.show=true;sv();say(s==="g"?"Верно! ✅":"Верно, с попытки №"+c.att+" (жёлтый)","ok")}
    else{const h="Не то («"+(heard||"…")+"»). ";say(c.att<3?h.trim():h+"Не вышло. Нажми на русскую фразу — увидишь перевод.","no")}
  };
  rec=r;r.lang="en-US";r.continuous=false;r.interimResults=true;r.maxAlternatives=3;
  r.onstart=()=>{if(!fin)say("Говори по-английски","")};
  r.onresult=e=>{
    if(fin)return;
    const alts=[];for(let k=0;k<e.results.length;k++)for(let i=0;i<e.results[k].length;i++)alts.push(e.results[k][i].transcript);
    const last=e.results[e.results.length-1];
    if(alts.some(x=>close(norm(x),t)))finish(true);
    else if(last.isFinal)finish(false,last[0]&&last[0].transcript);
  };
  r.onerror=e=>{
    if(fin||e.error==="aborted")return;
    fin=true;off();if(rec===r)live=false;
    say(e.error==="not-allowed"||e.error==="service-not-allowed"?"Микрофон заблокирован. Открой страницу в Chrome по обычной ссылке и разреши доступ.":e.error==="no-speech"?"Ничего не слышно. Попробуй ещё.":e.error==="network"?"Нет интернета: распознавание речи работает только онлайн.":"Ошибка: "+e.error,"no");
  };
  r.onend=()=>{if(rec===r)live=false;if(!fin){fin=true;off();say("Ничего не слышно. Попробуй ещё.","no")}};
  try{
    r.start();live=true;say("Включаю…","");
    t1=setTimeout(()=>{try{r.stop()}catch(e){}},4000);
    t2=setTimeout(()=>{if(!fin){fin=true;try{r.abort()}catch(e){}if(rec===r)live=false;say("Не расслышал. Нажми ещё раз.","no")}},6000);
  }catch(e){live=false;say("Не удалось включить микрофон","no")}
}
function tapR(){
  const id=curId();if(id==null)return;
  if(!c.done){L().res[id]="r";c.done=true;c.show=true;sv();say("","")}
  else{c.show=!c.show;render()}
}
function saveEd(){const id=curId(),i=document.getElementById("ei");if(id==null||!i)return;const v=i.value.trim();if(v){D.ed[id]=v;sv()}c.edit=false;render()}
function delL(){if(delI==null||delI===0)return;D.L.splice(delI,1);if(delI<D.cur)D.cur--;D.cur=Math.max(0,Math.min(D.cur,D.L.length-1));delI=null;sv();rc();render()}
let sh=false,st=null;
function shufL(l){
  const v=new Set(vis(l)),pos=[];
  l.ids.forEach((id,i)=>{if(v.has(id)&&!l.res[id])pos.push(i)});
  if(pos.length<2)return;
  const old=pos.map(i=>l.ids[i]),a=old.slice();
  for(let t=0;t<10;t++){
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    if(a[0]!==old[0])break;
  }
  if(a[0]===old[0])[a[0],a[1]]=[a[1],a[0]];
  pos.forEach((p,k)=>{l.ids[p]=a[k]});
}
function shufNow(){clearTimeout(st);sh=false;shufL(L());sv();rc();render()}
function shuf(){
  clearTimeout(st);sh=false;const l=D.L[0];l.res={};
  for(let i=l.ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l.ids[i],l.ids[j]]=[l.ids[j],l.ids[i]]}
  D.L=[l];D.cur=0;sv();rc();render();
}
function mk(kind){
  const l=L(),ids=vis(l).filter(id=>kind==="y"?l.res[id]==="y":(l.res[id]==="r"||l.res[id]==="y"));
  if(!ids.length)return;
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  D.L.push({n:"Урок "+(D.L.length+1)+" · "+(kind==="y"?"только жёлтые ("+ids.length+")":"❌ "+ids.length),ids,res:{}});
  D.cur=D.L.length-1;sv();rc();render();
}
function render(){
  const l=L(),n=cnt(l),id=curId(),tot=vis(l).length;
  let h=`<div class="top"><b>${esc(l.n)}</b><span class="tr"><span class="hint">${n.g+n.y+n.r} из ${tot}</span><button class="chip sf ${sh?"arm":"shb"}" data-a="sh">${sh?"Сбросить всё?":"🔀"}</button></span></div>
  <div class="chips"><button class="chip g" data-a="mg">✅ ${n.g}</button><button class="chip y" data-a="my"><svg class="ck" viewBox="0 0 24 24"><rect width="24" height="24" rx="5.5" fill="#f2b600"/><path d="M5.2 12.6l4.6 4.4L18.8 6.8" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg> ${n.y}</button><button class="chip r" data-a="mr">❌ ${n.r}</button></div>`;
  if(id==null){
    h+=`<div class="card"><div class="ru" style="cursor:default">${tot?"Урок пройден 🎉":"В уроке нет фраз"}</div><p class="hint">Нажми на ❌ или жёлтый ✅ сверху — получится новый урок для повторения.</p></div>`;
  }else{
    h+=`<div class="card"><div class="bar">${c.show&&!c.edit?'<button class="ib" data-a="ed">✏️</button>':"<span></span>"}<button class="ib" data-a="hd">Скрыть</button></div>
    <div class="row2"><div class="lf"><div class="ru" data-a="tr">${esc(P[id].r)}</div>
    <div class="gk">${c.edit?`<input id="ei" class="ei" value="${esc(gr(id)).replace(/"/g,"&quot;")}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="eb"><button data-a="ec">Отмена</button><button class="sv" data-a="es">Сохранить</button></div>`:c.show?`<button class="gbtn" data-a="sp">${esc(gr(id))}</button>`:'<span class="hint">нажми на фразу, если не знаешь</span>'}</div>
    </div><div class="mcol"><button class="rb ${live?"live":""}" data-a="mic" ${!c.done&&c.att>=3?"disabled":""}>🎤</button><div class="at">${(c.done&&(L().res[id]==="r"||!c.att))?"&nbsp;":(c.done?c.att:Math.min(c.att+1,3))+" из 3"}</div></div></div>
    <div class="fb ${mc}">${esc(msg)}</div>
    ${c.done?'<button class="next" data-a="nx">Далее →</button>':""}</div>`;
  }
  h+='<h3>Уроки <span class="hint" style="font-weight:400">· удерживай, чтобы удалить (кроме первого)</span></h3>'+D.L.map((x,i)=>{if(i===delI)return D.L.length<2?'<div class="dl"><span>Единственный урок удалить нельзя</span><button class="no" data-a="dn">Ок</button></div>':`<div class="dl"><span>Удалить «${esc(x.n)}»?</span><span><button class="no" data-a="dn">Нет</button> <button class="yes" data-a="dy">Удалить</button></span></div>`;const m=cnt(x);return `<button class="les ${i===D.cur?"on":""}" data-i="${i}"><span>${nm(x.n)}</span><span class="mini"><i class="g">${m.g}</i><i class="y">${m.y}</i><i class="r">${m.r}</i> / ${vis(x).length}</span></button>`}).join("");
  if(D.hid.length){
    h+=`<button class="rs" data-a="hl">Скрытые фразы: ${D.hid.length} ${showH?"▲":"▼"}</button>`;
    if(showH)h+=D.hid.map(id=>id===hI?`<div class="dl"><span>${esc(P[id].r)}</span><span><button class="yes" data-a="hdel">Удалить</button> <button class="ok" data-a="hret">Вернуть</button> <button class="no" data-a="hno">Отмена</button></span></div>`:`<div class="hp" data-h="${id}"><b>${esc(P[id].r)}</b><span>${esc(gr(id))}</span></div>`).join("");
  }
  document.getElementById("app").innerHTML=h;
}
document.addEventListener("click",e=>{
  if(lp){lp=false;return}if(Date.now()-lpT<400)return;const t=e.target.closest("[data-a],[data-i]");if(!t)return;
  if(t.dataset.i!==undefined){D.cur=+t.dataset.i;sv();rc();render();return}
  const a=t.dataset.a,id=curId();
  if(a==="mic")mic();else if(a==="tr")tapR();else if(a==="sp"&&id!=null)speak(gr(id));
  else if(a==="nx"){rc();render()}
  else if(a==="hd"&&id!=null){D.hid.push(id);sv();rc();render()}
  else if(a==="ed"&&id!=null){c.edit=true;render();setTimeout(()=>{const i=document.getElementById("ei");if(i){i.focus();i.select()}},0)}
  else if(a==="ec"){c.edit=false;render()}else if(a==="es")saveEd();
  else if(a==="my")mk("y");else if(a==="mr")mk("r");
  else if(a==="dn"){delI=null;render()}else if(a==="dy")delL();
  else if(a==="hl"){showH=!showH;hI=null;render()}
  else if(a==="hret"&&hI!=null){D.hid=D.hid.filter(x=>x!==hI);hI=null;sv();render()}
  else if(a==="hdel"&&hI!=null){D.del.push(hI);D.hid=D.hid.filter(x=>x!==hI);hI=null;sv();render()}
  else if(a==="hno"){hI=null;render()}
  else if(a==="sh"){if(sh)shuf();else{sh=true;render();clearTimeout(st);st=setTimeout(()=>{sh=false;render()},3000)}}else if(a==="mg")shufNow();
});
let lx=0,ly=0,lpT=0;
function lpOpen(b){
  lp=true;lpT=Date.now();
  if(b.classList.contains("les"))delI=+b.dataset.i;
  else if(b.classList.contains("hp"))hI=+b.dataset.h;
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
  render();
}
function lpTarget(t){
  const b=t.closest&&t.closest(".les,.hp");if(!b)return null;
  if(b.classList.contains("les")&&!(+b.dataset.i>0))return null;
  return b;
}
document.addEventListener("pointerdown",e=>{
  lp=false;clearTimeout(lt);lt=null;
  const b=lpTarget(e.target);if(!b)return;
  lx=e.clientX;ly=e.clientY;
  lt=setTimeout(()=>{lt=null;lpOpen(b)},500);
});
document.addEventListener("pointermove",e=>{if(lt&&Math.hypot(e.clientX-lx,e.clientY-ly)>16){clearTimeout(lt);lt=null}});
document.addEventListener("pointerup",()=>{clearTimeout(lt);lt=null});
window.addEventListener("scroll",()=>{clearTimeout(lt);lt=null},true);
document.addEventListener("contextmenu",e=>{
  if(e.target.closest&&e.target.closest("input"))return;
  e.preventDefault();
  const b=lpTarget(e.target);if(b&&!lp){clearTimeout(lt);lt=null;lpOpen(b)}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ei")saveEd()});
try{speechSynthesis.getVoices()}catch(e){}
render();
</script></body></html>
