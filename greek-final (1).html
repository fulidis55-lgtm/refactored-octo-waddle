    if(showH)h+=D.hid.map(id=>id===hI?`<div class="dl"><span>${esc(P[id].r)}</span><span><button class="yes" data-a="hdel">Удалить</button> <button class="ok" data-a="hret">Вернуть</button> <button class="no" data-a="hno">Отмена</button></span></div>`:`<div class="hp" data-h="${id}"><b>${esc(P[id].r)}</b><span>${esc(gr(id))}</span></div>`).join("");
  }
  document.getElementById("app").innerHTML=h;
}
document.addEventListener("click",e=>{
  if(lp){lp=false;return}if(Date.now()-lpT<400)return;const t=e.target.closest("[data-a],[data-i]");if(!t)return;
  if(t.dataset.i!==undefined){D.cur=+t.dataset.i;pickOpen=false;resetB();sv();rc();render();return}
  const a=t.dataset.a,id=curId();
  if(a==="mic")mic();else if(a==="tr")tapR();else if(a==="sp"&&id!=null)speak(gr(id));
  else if(a==="nx"){rc();render()}
  else if(a==="hd"&&id!=null){D.hid.push(id);sv();rc();render()}
  else if(a==="ed"&&id!=null){c.edit=true;render();setTimeout(()=>{const i=document.getElementById("ei");if(i){i.focus();i.select()}},0)}
  else if(a==="ec"){c.edit=false;render()}else if(a==="es")saveEd();
  else if(a==="mr")mk();
  else if(a==="tl"){pickOpen=!pickOpen;resetB();addOpen=false;showCW=false;cwI=null;render()}
  else if(a==="pc"){pickOpen=false;resetB();render()}
  else if(a==="bs")shareBase();
  else if(a==="bl"){loadOpen=true;lRes=null;bM="";bShow="";render()}
  else if(a==="lc"){resetB();render()}
  else if(a==="lpst")pasteBase();
  else if(a==="lck"){const r=parseBase(lT);if(r.err){bM=r.err}else{lRes=r;bM=""}render()}
  else if(a==="lbk"){lRes=null;render()}
  else if(a==="lap"&&lRes)applyBase(lRes);
  else if(a==="add"){try{if(rec&&live)rec.abort()}catch(e){}try{speechSynthesis.cancel()}catch(e){}addOpen=true;showCW=false;cwI=null;aM="";render();setTimeout(()=>{const i=document.getElementById("ar");if(i)i.focus()},0)}
  else if(a==="ax"){addOpen=false;aR="";aG="";aM="";render()}
  else if(a==="as")addW();
  else if(a==="cwc"){showCW=false;cwI=null;render()}
  else if(a==="cwx"){cwI=+t.dataset.w;render()}
  else if(a==="cwn"){cwI=null;render()}
  else if(a==="cwy"&&cwI!=null)delW(cwI);
  else if(a==="dn"){delI=null;render()}else if(a==="dy")delL();
  else if(a==="hl"){showH=!showH;hI=null;render()}
  else if(a==="hret"&&hI!=null){D.hid=D.hid.filter(x=>x!==hI);hI=null;sv();render()}
  else if(a==="hdel"&&hI!=null){const x=hI;hI=null;delW(x)}
  else if(a==="hno"){hI=null;render()}
  else if(a==="sh"){if(sh)shuf();else{sh=true;render();clearTimeout(st);st=setTimeout(()=>{sh=false;render()},3000)}}else if(a==="mg")shufNow();
});
let lx=0,ly=0,lpT=0;
function lpOpen(b){
  lp=true;lpT=Date.now();
  if(b.classList.contains("les"))delI=+b.dataset.i;
  else if(b.classList.contains("hp"))hI=+b.dataset.h;
  else if(b.classList.contains("add")){addOpen=false;pickOpen=false;showCW=true;cwI=null}
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
  render();
}
function lpTarget(t){
  const b=t.closest&&t.closest(".les,.hp,.add");if(!b)return null;
  if(b.classList.contains("les")){const x=D.L[+b.dataset.i];if(!x||x.fx)return null}
  return b;
}
document.addEventListener("pointerdown",e=>{
  lp=false;clearTimeout(lt);lt=null;
  const b=lpTarget(e.target);if(!b)return;
  lx=e.clientX;ly=e.clientY;
  lt=setTimeout(()=>{lt=null;lpOpen(b)},500);
});
document.addEventListener("pointermove",e=>{if(lt&&Math.hypot(e.clientX-lx,e.clientY-ly)>16){clearTimeout(lt);lt=null}});
document.addEventListener("pointerup",()=>{clearTimeout(lt);lt=null});
window.addEventListener("scroll",()=>{clearTimeout(lt);lt=null},true);
document.addEventListener("contextmenu",e=>{
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  e.preventDefault();
  const b=lpTarget(e.target);if(b&&!lp){clearTimeout(lt);lt=null;lpOpen(b)}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const i=e.target.id;if(i==="ei")saveEd();else if(i==="ar"){const g=document.getElementById("ag");if(g)g.focus()}else if(i==="ag")addW()});
document.addEventListener("input",e=>{if(e.target.id==="ar")aR=e.target.value;else if(e.target.id==="ag")aG=e.target.value;else if(e.target.id==="lt")lT=e.target.value});
try{speechSynthesis.getVoices()}catch(e){}
render();
</script></body></html>
