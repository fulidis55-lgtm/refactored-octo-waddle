.big{width:100%;padding:12px;border:1px solid var(--ac);background:none;color:var(--ac);border-radius:12px;font-size:16px;margin-bottom:10px}

let S={know:[],dont:[]};
try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&x.know&&x.dont)S=x}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const decided=id=>S.know.includes(id)||S.dont.includes(id);
let tab="learn",Q=[],qi=0,c={},fbT="",fbC="",live=false,rec=null;
function startQ(ids){Q=ids;qi=0;c={fail:0,heard:false,done:false,reveal:false};fbT="";fbC=""}
function startLearn(){startQ(P.filter(p=>!decided(p.id)).map(p=>p.id))}
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ς/g,"σ").replace(/[^\u0370-\u03ffa-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const close=(a,b)=>{if(!a||!b)return false;return 1-lev(a,b)/Math.max(a.length,b.length)>=0.8};
function decide(ok){if(c.done)return;c.done=true;const id=Q[qi];S.know=S.know.filter(x=>x!==id);S.dont=S.dont.filter(x=>x!==id);(ok?S.know:S.dont).push(id);save()}
function say(t,k){fbT=t;fbC=k||"";const f=document.getElementById("fb");if(f){f.textContent=t;f.className="fb "+fbC}}
function speak(text){
  if(!("speechSynthesis" in window)){say("Озвучка не поддерживается в этом браузере","no");return}
  try{if(rec&&live)rec.abort()}catch(e){}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="el-GR";u.rate=0.8;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("el"));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function onSpeaker(){
  const p=P[Q[qi]];speak(p.g);
  if(!c.done){c.heard=true;decide(false);say("Послушай и повтори. Фраза пойдёт в «Не знаю». Нажми на неё — увидишь перевод.","");render()}
}
function onMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say("Распознавание речи не поддерживается. Открой в Chrome или Safari.","no");return}
  if(live){try{rec.stop()}catch(e){}return}
  try{speechSynthesis.cancel()}catch(e){}
  const p=P[Q[qi]],target=norm(p.g);
  rec=new SR();rec.lang="el-GR";rec.interimResults=false;rec.maxAlternatives=5;
  rec.onresult=e=>{
    const alts=[];for(const r of e.results)for(let i=0;i<r.length;i++)alts.push(r[i].transcript);
    if(alts.some(a=>close(norm(a),target))){
      if(!c.done){const first=c.fail===0&&!c.heard;decide(first);say(first?"Верно с первого раза! Нажми на фразу — перевод.":"Верно! Но не с первого раза — фраза в «Не знаю».","ok")}
      else say("Верно!","ok");
      render();
    }else{c.fail++;say("Не то. Услышал: «"+(alts[0]||"…")+"». Попробуй ещё.","no")}
  };
  rec.onerror=e=>{live=false;updMic();say(e.error==="not-allowed"||e.error==="service-not-allowed"?(window.self!==window.top?"Микрофон заблокирован внутри встроенной страницы. Открой эту страницу в отдельной вкладке браузера (Chrome или Safari) и разреши микрофон.":"Микрофон заблокирован. Разреши доступ к микрофону для этого сайта в настройках браузера."):e.error==="no-speech"?"Ничего не слышно. Попробуй ещё.":"Ошибка распознавания: "+e.error,"no")};
  rec.onend=()=>{live=false;updMic()};
  try{rec.start();live=true;updMic();say("Слушаю… говори","")}catch(e){live=false;say("Не удалось включить микрофон ("+(e.name||"ошибка")+")"+(window.self!==window.top?". Открой страницу в отдельной вкладке.":""),"no")}
}
function updMic(){const b=document.getElementById("mic");if(b)b.classList.toggle("live",live)}
function tapPhrase(){
  if(!c.done){say("Сначала произнеси фразу или нажми динамик","");return}
  c.reveal=!c.reveal;render();
}
function next(){qi++;c={fail:0,heard:false,done:false,reveal:false};fbT="";fbC="";render()}
function skip(){decide(false);next()}
const esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function render(){
  const T=document.getElementById("tabs");
  T.innerHTML=[["learn","Учить"],["know","Знаю ("+S.know.length+")"],["dont","Не знаю ("+S.dont.length+")"]].map(t=>`<button class="tab ${tab===t[0]?"on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("");
  const A=document.getElementById("app");
  if(tab==="learn"){
    if(qi>=Q.length){
      A.innerHTML=`<div class="card"><div class="gr" style="cursor:default">${Q.length?"Круг пройден 🎉":"Все фразы пройдены 🎉"}</div><p class="hint">Знаю: ${S.know.length} · Не знаю: ${S.dont.length} · Всего: ${P.length}</p>${S.dont.length?`<button class="next" data-act="retry">Повторить «Не знаю» (${S.dont.length})</button>`:""}</div>`;return}
    const p=P[Q[qi]];
    const left=P.length-S.know.length-S.dont.length;
    A.innerHTML=`<div class="prog">Фраза ${qi+1} из ${Q.length} · осталось новых: ${left}</div>
    <div class="card"><div class="gr" data-act="phrase">${esc(p.g)}</div>
    <div class="ru">${c.done?(c.reveal?esc(p.r):'<span class="hint">нажми на фразу — перевод</span>'):'<span class="hint">произнеси или послушай</span>'}</div>
    <div class="row"><button class="rb" data-act="spk" aria-label="Послушать">🔊</button><div class="fb ${fbC}" id="fb">${esc(fbT)}</div><button class="rb mic ${live?"live":""}" id="mic" data-act="mic" aria-label="Говорить">🎤</button></div>
    ${c.done?`<button class="next" data-act="next">Далее →</button>`:`<button class="skip" data-act="skip">Пропустить</button>`}</div>`;
  }else{
    const ids=S[tab];
    A.innerHTML=(tab==="dont"&&ids.length?`<button class="big" data-act="retry">Повторить эти фразы (${ids.length})</button>`:"")+
    (ids.length?ids.slice().reverse().map(id=>{const p=P[id];return `<div class="it" data-it><div class="t"><span>${esc(p.g)}</span><button class="sb" data-spk="${id}">🔊</button></div><div class="r">${esc(p.r)}</div></div>`}).join(""):'<p class="hint" style="text-align:center">Пока пусто</p>');
  }
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act],[data-spk],[data-it]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;if(tab==="learn"&&(qi>=Q.length||!Q.length))startLearn();render();return}
  if(t.dataset.spk){speak(P[+t.dataset.spk].g);return}
  if(t.hasAttribute("data-it")){t.classList.toggle("open");return}
  const a=t.dataset.act;
  if(a==="phrase")tapPhrase();else if(a==="spk")onSpeaker();else if(a==="mic")onMic();
  else if(a==="next")next();else if(a==="skip")skip();
  else if(a==="retry"){startQ(S.dont.slice());tab="learn";render()}
});
document.getElementById("rs").onclick=()=>{if(confirm("Сбросить весь прогресс?")){S={know:[],dont:[]};save();startLearn();tab="learn";render()}};
try{speechSynthesis.getVoices()}catch(e){}
startLearn();render();
</script></body></html>
