<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Греческий — 50 фраз</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ac:#1f5fbf;--ok:#1f8a4c;--no:#c0392b;--bd:#e3e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e232c;--tx:#eceef2;--mut:#98a0ae;--ac:#6ea3ff;--ok:#4cc27d;--no:#ef7a6c;--bd:#2c3340}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e232c;--tx:#eceef2;--mut:#98a0ae;--ac:#6ea3ff;--ok:#4cc27d;--no:#ef7a6c;--bd:#2c3340}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{max-width:520px;margin:0 auto;padding:12px 14px 30px;zoom:.8}
button{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.tr{display:flex;align-items:center;gap:8px}
.hint{color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip,.mini i{border:none;border-radius:10px;padding:8px 14px;font-size:16px;font-weight:600;font-style:normal}
.g{background:#d3efdd;color:#14532d}.y{background:#fcecaa;color:#3a2f00}.ck{display:inline-block;width:1.2em;height:1.2em;line-height:1.2em;border-radius:5px;background:#f2b600;color:#fff;font-size:.85em;text-align:center;vertical-align:middle}.r{background:#f9d3cd;color:#7f1d1d}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 16px 18px;text-align:center}
.bar{display:flex;justify-content:space-between}
.ib{background:none;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;font-size:14px}
.ru{font-size:27px;font-weight:600;line-height:1.3;cursor:pointer;padding:18px 4px 10px;word-break:break-word}
.gk{min-height:44px}.ei{width:100%;font-size:22px;padding:10px;border:2px solid var(--ac);border-radius:12px;background:var(--card);color:var(--tx);text-align:center}.eb{display:flex;gap:8px;margin-top:8px}.eb button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:none;font-size:15px}.eb .sv{background:var(--ok);color:#fff;border-color:var(--ok)}
.gbtn{background:none;border:2px solid var(--ac);border-radius:12px;color:var(--ac);font-size:26px;font-weight:600;padding:10px 18px;max-width:100%;word-break:break-word}
.row{display:flex;align-items:center;gap:10px;margin-top:12px}
.fb{flex:1;font-size:14px;color:var(--mut);text-align:left;min-height:40px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.rb{width:68px;height:68px;border-radius:50%;border:none;background:var(--ac);color:#fff;font-size:29px;flex:none}
.row2{display:flex;align-items:center;gap:10px;margin-top:6px}.lf{flex:1;min-width:0}.lf .ru{text-align:left;padding:8px 4px 2px}.lf .gk{text-align:left;min-height:44px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}.at{font-size:13px;color:var(--mut)}
.card>.fb{margin-top:6px;text-align:center;min-height:0}
.rb:disabled{opacity:.35}.rb.live{background:var(--no);animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.08)}}
.next{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;background:var(--ok);color:#fff;font-size:17px;font-weight:600}
h3{margin:22px 0 8px;font-size:16px}
.les{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.les.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.les{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dl{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f9d3cd;color:#7f1d1d;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px}.dl button{border:none;border-radius:8px;padding:8px 12px;font-size:14px}.dl .no{background:rgba(255,255,255,.75);color:#7f1d1d}.dl .yes{background:#c0392b;color:#fff}.dl .ok{background:#1f8a4c;color:#fff}.dl{flex-wrap:wrap}
.hp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.hp b{display:block;font-size:16px}.hp span{color:var(--ac);font-size:15px}
.mini{white-space:nowrap;font-size:13px;color:var(--mut)}.mini i{padding:3px 8px;font-size:13px;margin-right:3px}
.rs{display:block;margin:14px auto 0;background:none;border:none;color:var(--mut);font-size:13px;text-decoration:underline}
</style></head><body>
<div id="app"></div>
<script>
const RAW=`Доброе утро|Καλημέρα
Добрый вечер|Καλησπέρα
Здравствуйте|Γεια σας
До свидания|Αντίο
Как дела?|Τι κάνεις;
Всё хорошо, спасибо|Όλα καλά, ευχαριστώ
Спасибо|Ευχαριστώ
Пожалуйста|Παρακαλώ
Извините|Συγγνώμη
Да|Ναι
Нет|Όχι
Я не понимаю|Δεν καταλαβαίνω
Помедленнее, пожалуйста|Πιο αργά, παρακαλώ
Можете повторить?|Μπορείτε να το επαναλάβετε;
Вы говорите по-английски?|Μιλάτε αγγλικά;
Сколько стоит?|Πόσο κάνει;
Это очень дорого|Είναι πολύ ακριβό
Я возьму это|Θα πάρω αυτό
Один килограмм, пожалуйста|Ένα κιλό, παρακαλώ
Ещё немного|Λίγο ακόμα
Хватит, спасибо|Αρκεί, ευχαριστώ
Больше ничего|Τίποτε άλλο
Где касса?|Πού είναι το ταμείο;
Мне нужен пакет|Χρειάζομαι μια σακούλα
Я плачу картой|Πληρώνω με κάρτα
Я плачу наличными|Πληρώνω μετρητά
Мне нужен чек|Θέλω απόδειξη
У вас есть сдача?|Έχετε ρέστα;
Это свежее?|Είναι φρέσκο;
Есть скидка?|Έχει έκπτωση;
У вас есть хлеб?|Έχετε ψωμί;
Литр молока|Ένα λίτρο γάλα
Доброе утро, сосед|Καλημέρα γείτονα
Что нового?|Τι νέα;
Сегодня хорошая погода|Ωραίος καιρός σήμερα
Очень жарко|Κάνει πολλή ζέστη
Я ваш новый сосед|Είμαι ο νέος γείτονας
Я живу на втором этаже|Μένω στον δεύτερο όροφο
У вас есть дети?|Έχετε παιδιά;
Вы можете мне помочь?|Μπορείτε να με βοηθήσετε;
Спасибо вам за помощь|Σας ευχαριστώ για τη βοήθεια
Простите за шум|Συγγνώμη για τον θόρυβο
Где мусорный бак?|Πού είναι ο κάδος σκουπιδιών;
Хороших выходных|Καλό Σαββατοκύριακο
Где туалет?|Πού είναι η τουαλέτα;
Где остановка?|Πού είναι η στάση;
Это далеко?|Είναι μακριά;
Поверните направо|Στρίψτε δεξιά
Поверните налево|Στρίψτε αριστερά
Прямо|Ευθεία`;
const P=RAW.split("\n").map((l,i)=>{const a=l.split("|");return{id:i,r:a[0],g:a[1]}});
const K="gr-v3";
let D={L:[{n:"Урок 1 · 50 фраз",ids:P.map(p=>p.id),res:{}}],cur:0,ed:{},hid:[]};
try{const x=JSON.parse(localStorage.getItem(K)||"null");if(x&&x.L)D=x}catch(e){}
D.del=D.del||[];D.L.forEach(x=>{x.n=x.n.replace(/❌ \+ жёлтые \((\d+)\)/,"❌ $1")});
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
let c,msg,mc,live=false,rec=null,delI=null,lt=null,lp=false,showH=false,hI=null;
const rc=()=>{c={att:0,done:false,show:false};msg="";mc=""};rc();
const L=()=>D.L[D.cur],gr=id=>D.ed[id]||P[id].g,vis=l=>l.ids.filter(id=>!D.hid.includes(id)&&!D.del.includes(id));
const cnt=l=>{const n={g:0,y:0,r:0};vis(l).forEach(id=>{if(l.res[id])n[l.res[id]]++});return n};
const curId=()=>{const v=vis(L());if(c.id!=null&&v.includes(c.id))return c.id;const f=v.find(id=>!L().res[id]);if(f!=null)c.id=f;return f};
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ς/g,"σ").replace(/[^\u0370-\u03ffa-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const close=(a,b)=>a&&b&&1-lev(a,b)/Math.max(a.length,b.length)>=0.8;
function say(t,k){msg=t;mc=k||"";render()}
function speak(t){
  if(!("speechSynthesis" in window)){say("Озвучка не поддерживается","no");return}
  try{if(rec&&live)rec.abort()}catch(e){}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="el-GR";u.rate=0.8;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("el"));if(v)u.voice=v;speechSynthesis.speak(u);
}
function mic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say("Нужен Chrome или Safari","no");return}
  if(live){try{rec.stop()}catch(e){}return}
  const id=curId();if(id==null||c.done||c.att>=5)return;
  try{speechSynthesis.cancel()}catch(e){}
  const t=norm(gr(id));
  rec=new SR();rec.lang="el-GR";rec.interimResults=false;rec.maxAlternatives=5;
  rec.onresult=e=>{
    const a=[];for(const r of e.results)for(let i=0;i<r.length;i++)a.push(r[i].transcript);
    c.att++;
    if(a.some(x=>close(norm(x),t))){
      const s=c.att<=2?"g":"y";L().res[id]=s;c.done=true;c.show=true;sv();
      say(s==="g"?"Верно! ✅":"Верно, с попытки №"+c.att+" (жёлтый)","ok");
    }else{
      const h="Не то («"+(a[0]||"…")+"»). ";
      say(c.att===2?h+"Дам ещё три попытки.":c.att<5?h+"Попытка "+(c.att+1)+" из 5.":h+"Не вышло. Нажми на русскую фразу — увидишь перевод.","no");
    }
  };
  rec.onerror=e=>{live=false;say(e.error==="not-allowed"||e.error==="service-not-allowed"?"Микрофон заблокирован. Открой страницу в Chrome по обычной ссылке и разреши доступ.":e.error==="no-speech"?"Ничего не слышно. Попробуй ещё.":"Ошибка: "+e.error,"no")};
  rec.onend=()=>{live=false;render()};
  try{rec.start();live=true;say("Слушаю… говори по-гречески","")}catch(e){live=false;say("Не удалось включить микрофон","no")}
}
function tapR(){
  const id=curId();if(id==null)return;
  if(!c.done){L().res[id]="r";c.done=true;c.show=true;sv();say("","")}
  else{c.show=!c.show;render()}
}
function saveEd(){const id=curId(),i=document.getElementById("ei");if(id==null||!i)return;const v=i.value.trim();if(v){D.ed[id]=v;sv()}c.edit=false;render()}
function delL(){if(delI==null||delI===0)return;D.L.splice(delI,1);if(delI<D.cur)D.cur--;D.cur=Math.max(0,Math.min(D.cur,D.L.length-1));delI=null;sv();rc();render()}
let sh=false,st=null;
function shuf(){
  if(!sh){sh=true;render();clearTimeout(st);st=setTimeout(()=>{sh=false;render()},3000);return}
  clearTimeout(st);sh=false;const l=D.L[0];l.res={};
  for(let i=l.ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l.ids[i],l.ids[j]]=[l.ids[j],l.ids[i]]}
  D.L=[l];D.cur=0;sv();rc();render();
}
function mk(kind){
  const l=L(),ids=vis(l).filter(id=>kind==="y"?l.res[id]==="y":(l.res[id]==="r"||l.res[id]==="y"));
  if(!ids.length)return;
  D.L.push({n:"Урок "+(D.L.length+1)+" · "+(kind==="y"?"только жёлтые ("+ids.length+")":"❌ "+ids.length),ids,res:{}});
  D.cur=D.L.length-1;sv();rc();render();
}
function render(){
  const l=L(),n=cnt(l),id=curId(),tot=vis(l).length;
  let h=`<div class="top"><b>${esc(l.n)}</b><span class="tr"><span class="hint">${n.g+n.y+n.r} из ${tot}</span><button class="ib" data-a="sh">${sh?"Сбросить всё?":"🔀"}</button></span></div>
  <div class="chips"><span class="chip g">✅ ${n.g}</span><button class="chip y" data-a="my"><span class="ck">✓</span> ${n.y}</button><button class="chip r" data-a="mr">❌ ${n.r}</button></div>`;
  if(id==null){
    h+=`<div class="card"><div class="ru" style="cursor:default">${tot?"Урок пройден 🎉":"В уроке нет фраз"}</div><p class="hint">Нажми на ❌ или жёлтый ✅ сверху — получится новый урок для повторения.</p></div>`;
  }else{
    h+=`<div class="card"><div class="bar">${c.show&&!c.edit?'<button class="ib" data-a="ed">✏️</button>':"<span></span>"}<button class="ib" data-a="hd">Скрыть</button></div>
    <div class="row2"><div class="lf"><div class="ru" data-a="tr">${esc(P[id].r)}</div>
    <div class="gk">${c.edit?`<input id="ei" class="ei" value="${esc(gr(id)).replace(/"/g,"&quot;")}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="eb"><button data-a="ec">Отмена</button><button class="sv" data-a="es">Сохранить</button></div>`:c.show?`<button class="gbtn" data-a="sp">${esc(gr(id))}</button>`:'<span class="hint">нажми на фразу, если не знаешь</span>'}</div>
    </div><div class="mcol"><button class="rb ${live?"live":""}" data-a="mic" ${c.done||c.att>=5?"disabled":""}>🎤</button><div class="at">${(c.done&&!c.att)?"&nbsp;":(c.done?c.att:Math.min(c.att+1,5))+" из 5"}</div></div></div>
    <div class="fb ${mc}">${esc(msg)}</div>
    ${c.done?'<button class="next" data-a="nx">Далее →</button>':""}</div>`;
  }
  h+='<h3>Уроки <span class="hint" style="font-weight:400">· удерживай, чтобы удалить (кроме первого)</span></h3>'+D.L.map((x,i)=>{if(i===delI)return D.L.length<2?'<div class="dl"><span>Единственный урок удалить нельзя</span><button class="no" data-a="dn">Ок</button></div>':`<div class="dl"><span>Удалить «${esc(x.n)}»?</span><span><button class="no" data-a="dn">Нет</button> <button class="yes" data-a="dy">Удалить</button></span></div>`;const m=cnt(x);return `<button class="les ${i===D.cur?"on":""}" data-i="${i}"><span>${esc(x.n)}</span><span class="mini"><i class="g">${m.g}</i><i class="y">${m.y}</i><i class="r">${m.r}</i> / ${vis(x).length}</span></button>`}).join("");
  if(D.hid.length){
    h+=`<button class="rs" data-a="hl">Скрытые фразы: ${D.hid.length} ${showH?"▲":"▼"}</button>`;
    if(showH)h+='<h3>Скрытые фразы <span class="hint" style="font-weight:400">· удерживай фразу — вернуть или удалить</span></h3>'+D.hid.map(id=>id===hI?`<div class="dl"><span>${esc(P[id].r)}</span><span><button class="yes" data-a="hdel">Удалить</button> <button class="ok" data-a="hret">Вернуть</button> <button class="no" data-a="hno">Отмена</button></span></div>`:`<div class="hp" data-h="${id}"><b>${esc(P[id].r)}</b><span>${esc(gr(id))}</span></div>`).join("")+'<button class="rs" data-a="un">Вернуть все</button>';
  }
  document.getElementById("app").innerHTML=h;
}
document.addEventListener("click",e=>{
  if(lp){lp=false;return}const t=e.target.closest("[data-a],[data-i]");if(!t)return;
  if(t.dataset.i!==undefined){D.cur=+t.dataset.i;sv();rc();render();return}
  const a=t.dataset.a,id=curId();
  if(a==="mic")mic();else if(a==="tr")tapR();else if(a==="sp"&&id!=null)speak(gr(id));
  else if(a==="nx"){rc();render()}
  else if(a==="hd"&&id!=null){D.hid.push(id);sv();rc();render()}
  else if(a==="ed"&&id!=null){c.edit=true;render();setTimeout(()=>{const i=document.getElementById("ei");if(i){i.focus();i.select()}},0)}
  else if(a==="ec"){c.edit=false;render()}else if(a==="es")saveEd();
  else if(a==="my")mk("y");else if(a==="mr")mk("r");
  else if(a==="un"){D.hid=[];sv();rc();render()}
  else if(a==="dn"){delI=null;render()}else if(a==="dy")delL();
  else if(a==="hl"){showH=!showH;hI=null;render()}
  else if(a==="hret"&&hI!=null){D.hid=D.hid.filter(x=>x!==hI);hI=null;sv();render()}
  else if(a==="hdel"&&hI!=null){D.del.push(hI);D.hid=D.hid.filter(x=>x!==hI);hI=null;sv();render()}
  else if(a==="hno"){hI=null;render()}
  else if(a==="sh")shuf();
});
document.addEventListener("pointerdown",e=>{lp=false;clearTimeout(lt);const b=e.target.closest(".les");if(b&&+b.dataset.i>0)lt=setTimeout(()=>{lp=true;delI=+b.dataset.i;render()},600)});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>clearTimeout(lt)));
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".hp");if(b)lt=setTimeout(()=>{lp=true;hI=+b.dataset.h;render()},600)});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".les,.hp"))e.preventDefault()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ei")saveEd()});
try{speechSynthesis.getVoices()}catch(e){}
render();
</script></body></html>
